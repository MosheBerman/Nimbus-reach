<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Nimbus Reach">
<meta name="theme-color" content="#12142e">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="icon-512.png">
<link rel="manifest" href="manifest.webmanifest">
<style>
html{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);background:#12142e}
*,*::before,*::after{box-sizing:inherit}
body{margin:0}
img{max-width:100%}
[hidden]{display:none!important}
</style>
<title>Nimbus Reach</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400;600;700&family=Figtree:wght@400;500;600;700&display=swap">
<style>
/* Layout: full-height game — pixel-art stage (low-res canvas scaled up crisply) above a persistent bottom dashboard.
   Single deliberate look: a retro dusk console; colors fixed rather than theme-switched. */
:root{
  color-scheme: dark;
  --night:#12142e;
  --panel:#1c1d45;
  --panel-2:#272a5e;
  --ink:#fdf6ef;
  --dim:#c3bde6;
  --faint:#8f88c0;
  --sun:#ffc23d;
  --sun-ink:#2b1a12;
  --leaf:#4fcc6e;
  --crystal:#5ef0d2;
  --danger:#ff5a4e;
  --line:#3d3f86;
  --shadow:#0a0b20;
  --font-pixel:'Pixelify Sans','Courier New',monospace;
  --font-body:'Figtree',system-ui,-apple-system,'Segoe UI',sans-serif;
}
html,body{height:100%}
body{
  margin:0;background:var(--night);color:var(--ink);font-family:var(--font-body);overflow:hidden;
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent;
}
#app{
  height:100%;box-sizing:border-box;display:flex;flex-direction:column;gap:10px;
  padding-left:max(16px, env(safe-area-inset-left, 0px));
  padding-right:max(16px, env(safe-area-inset-right, 0px));
  padding-block:10px;
}
#stage{position:relative;flex:1;min-height:0;overflow:hidden;background:#1d2a5a;border:3px solid var(--line);border-radius:6px;touch-action:none}
#cv{position:absolute;inset:0;display:block;width:100%;height:100%;image-rendering:pixelated}
.hint{position:absolute;left:10px;top:10px;font-family:var(--font-pixel);font-size:13px;color:var(--ink);background:rgba(18,20,46,.7);border:2px solid var(--line);padding:3px 9px;pointer-events:none}
#overlay{position:absolute;inset:0;display:grid;place-items:center;overflow:auto;padding:16px;box-sizing:border-box;background:rgba(10,10,30,.55);touch-action:pan-y}
.panel{
  width:min(680px,100%);box-sizing:border-box;background:var(--panel);
  border:3px solid var(--line);border-radius:4px;box-shadow:6px 6px 0 var(--shadow);
  padding:26px 30px;display:flex;flex-direction:column;gap:14px;
}
*{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-user-drag:none}
button{touch-action:manipulation}
#devBadge{position:absolute;left:50%;top:10px;transform:translateX(-50%);font-family:var(--font-pixel);font-size:13px;font-weight:700;color:#2b1a12;background:#ff86d0;border:2px solid #b8287e;padding:2px 10px;pointer-events:none;z-index:2}
.dev-note{font-size:14px;color:#ff9ad8}
.seg{display:flex;flex-wrap:wrap;align-items:center;gap:8px}
.seg .eyebrow{margin-right:4px}
.btn.small{font-size:14px;padding:5px 12px}
.btn[aria-pressed="true"]{background:#4fcc6e;border-color:#2a9a55;color:#0b2a18}
.panel.narrow{width:min(460px,100%);text-align:center;align-items:center}
.panel h1{font-family:var(--font-pixel);font-weight:700;font-size:clamp(42px,7vw,76px);line-height:.95;margin:0;color:#9df7a8;text-shadow:4px 4px 0 #17663b;letter-spacing:.01em}
.panel h2{font-family:var(--font-pixel);font-weight:700;font-size:32px;margin:0;line-height:1.05;color:#fff1d6;text-shadow:3px 3px 0 var(--shadow)}
.panel h3{font-family:var(--font-pixel);font-size:14px;letter-spacing:.12em;text-transform:uppercase;color:var(--faint);margin:6px 0 0;font-weight:600}
.eyebrow{font-family:var(--font-pixel);font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--faint);font-weight:600}
.lede{margin:0;color:var(--dim);font-size:16px;line-height:1.55;max-width:60ch}
.actions{display:flex;flex-wrap:wrap;gap:10px}
.panel.narrow .actions{justify-content:center}
button{font:inherit;cursor:pointer}
.btn{font-family:var(--font-pixel);font-weight:600;font-size:17px;padding:9px 18px;border:3px solid var(--line);border-radius:3px;background:var(--panel-2);color:var(--ink);box-shadow:3px 3px 0 var(--shadow)}
.btn:hover{background:#33367a}
.btn:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--shadow)}
.btn.primary{background:var(--sun);border-color:#c98a12;color:var(--sun-ink)}
.btn.primary:hover{background:#ffd36b}
button:focus-visible{outline:3px solid var(--sun);outline-offset:3px}
.guide{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px 18px}
.guide li{display:flex;align-items:center;gap:10px;min-width:0}
.guide canvas{width:40px;height:40px;flex:none;image-rendering:pixelated}
.guide p{margin:0;font-size:13.5px;line-height:1.35;color:var(--dim);min-width:0}
.guide p strong{color:var(--ink);display:block;font-size:14px}
.tally{display:grid;grid-template-columns:auto auto;gap:5px 26px;font-size:15px;color:var(--dim)}
.tally b{color:var(--ink);text-align:right;font-family:var(--font-pixel);font-size:17px}
.tally .total{color:var(--sun);font-size:19px}
kbd{font-family:var(--font-pixel);font-size:12px;color:var(--ink);background:var(--panel-2);border:2px solid var(--line);border-radius:2px;padding:0 5px}
.touch-only{display:none}

/* Dashboard */
#dash{display:flex;flex-wrap:wrap;align-items:center;gap:8px 26px;padding:10px 16px;background:var(--panel);border:3px solid var(--line);border-radius:4px;box-shadow:4px 4px 0 var(--shadow)}
.d-place{display:flex;flex-direction:column;gap:0;min-width:0;flex:0 1 210px}
.d-name{font-family:var(--font-pixel);font-size:23px;font-weight:700;line-height:1.1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.d-meters{display:flex;flex-direction:column;gap:5px;flex:1 1 300px;min-width:210px}
.mrow{display:grid;grid-template-columns:74px minmax(0,1fr) 3.6em;align-items:center;gap:10px}
.mrow > span:last-child{text-align:right;font-family:var(--font-pixel);font-size:15px}
.meter{height:12px;background:#0d0e26;border:2px solid var(--line);overflow:hidden}
.meter > div{height:100%;width:100%;background-image:repeating-linear-gradient(90deg, transparent 0 6px, rgba(0,0,0,.28) 6px 8px)}
.pow .meter{height:8px}
.m-hp > div{background-color:#3ddc6a}
.m-hp.low > div{background-color:var(--danger)}
.m-day > div{background-color:var(--sun)}
.m-day.low > div{background-color:var(--danger)}
.m-fly > div{background-color:#9ad8ff}
.m-paint > div{background-color:#ff7ac8}
.d-counts{display:flex;flex-wrap:wrap;gap:6px 22px}
.stat{display:flex;flex-direction:column;gap:0}
.val{font-family:var(--font-pixel);font-size:22px;font-weight:600;display:flex;align-items:center;gap:7px;min-height:26px}
.gem-ico{width:10px;height:10px;background:var(--crystal);transform:rotate(45deg)}
.key-ico{width:14px;height:8px;border:3px solid var(--sun);box-sizing:border-box}
.map-status{font-size:14px;color:var(--dim);flex:1 1 220px;min-width:0;line-height:1.45}
.map-status b{color:var(--ink)}
#dash[data-mode="map"] .play-only{display:none}
#dash[data-mode="play"] .map-only{display:none}

/* Touch controls */
.tbtn{position:absolute;display:none;font-family:var(--font-pixel);font-weight:700;color:var(--ink);border:3px solid var(--line);background:rgba(28,29,69,.72);box-shadow:3px 3px 0 rgba(10,11,32,.7);touch-action:none}
#jumpBtn{right:calc(14px + env(safe-area-inset-right, 0px));bottom:16px;width:84px;height:84px;border-radius:50%;font-size:17px;background:rgba(79,204,110,.45);border-color:#2a9a55}
#jumpBtn:active,#jumpBtn.on{background:rgba(79,204,110,.75)}
#pauseBtn{right:12px;top:10px;width:44px;height:40px;border-radius:4px;font-size:15px}
#mapSettingsBtn{left:12px;top:10px;width:44px;height:40px;border-radius:4px;font-size:16px}
#joy{position:absolute;width:120px;height:120px;margin:-60px 0 0 -60px;border-radius:50%;border:3px solid rgba(253,246,239,.45);background:rgba(28,29,69,.35);pointer-events:none}
#knob{position:absolute;left:50%;top:50%;width:50px;height:50px;margin:-25px 0 0 -25px;border-radius:50%;background:rgba(253,246,239,.8);border:3px solid #fff}
#joyHint{position:absolute;left:18px;bottom:20px;font-family:var(--font-pixel);font-size:13px;color:rgba(253,246,239,.75);pointer-events:none;display:none}
@media (pointer:coarse){
  .tbtn{display:block}
  #joyHint{display:block}
  .hint{display:none}
  .touch-only{display:inline}
  .key-only{display:none}
}
@media (max-width:640px){
  .guide{grid-template-columns:minmax(0,1fr)}
  .panel{padding:20px 18px}
  #dash{gap:6px 14px;padding:8px 10px}
  .d-name{font-size:19px}
  .val{font-size:18px}
  .mrow{grid-template-columns:62px minmax(0,1fr) 3.2em}
}
@media (max-height:520px){
  #app{gap:6px;padding-block:6px}
  #dash{gap:4px 16px;padding:5px 10px}
  .d-place{display:none}
  .d-meters{gap:3px}
  .val{font-size:17px;min-height:20px}
  .meter{height:9px}
  #jumpBtn{width:70px;height:70px}
}
</style>

</head>
<body>
<div id="app">
  <main id="stage">
    <canvas id="cv" aria-label="Game view"></canvas>
    <div class="hint" id="hint"></div>
    <div id="joyHint">Drag here to roll</div>
    <div id="joy" hidden><div id="knob"></div></div>
    <button class="tbtn" id="jumpBtn" aria-label="Jump">JUMP</button>
    <button class="tbtn" id="pauseBtn" aria-label="Pause">II</button>
    <button class="tbtn" id="mapSettingsBtn" aria-label="Settings">⚙</button>
    <div id="devBadge" hidden>DEV MODE &middot; all isles open</div>
    <div id="overlay"></div>
  </main>

  <footer id="dash" data-mode="map">
    <div class="d-place">
      <span class="eyebrow" id="dKing">Cloudmeadow &middot; Isle 1-1</span>
      <span class="d-name" id="dName">First Light</span>
    </div>
    <div class="d-meters play-only">
      <div class="mrow"><span class="eyebrow">Health</span><div class="meter m-hp" id="mHp"><div id="dHp"></div></div><span id="dHpN">100</span></div>
      <div class="mrow"><span class="eyebrow">Daylight</span><div class="meter m-day" id="mDay"><div id="dDay"></div></div><span id="dDayN">90s</span></div>
      <div id="pows" style="display:contents"></div>
    </div>
    <div class="d-counts play-only">
      <div class="stat"><span class="eyebrow">Crystals</span><span class="val"><i class="gem-ico"></i><span id="dGems">0/0</span></span></div>
      <div class="stat"><span class="eyebrow">Keys</span><span class="val"><i class="key-ico"></i><span id="dKeys">0</span></span></div>
      <div class="stat"><span class="eyebrow">Score</span><span class="val" id="dScore">0</span></div>
      <div class="stat"><span class="eyebrow">Lives</span><span class="val" id="dLives">3</span></div>
    </div>
    <div class="map-status map-only" id="dMapStatus"></div>
    <div class="d-counts map-only">
      <div class="stat"><span class="eyebrow">Cleared</span><span class="val" id="dCleared">0/15</span></div>
      <div class="stat"><span class="eyebrow">Kingdom score</span><span class="val" id="dTotal">0</span></div>
    </div>
  </footer>
</div>

function rgb(h){ const n = parseInt(h.slice(1), 16); return [n >> 16 & 255, n >> 8 & 255, n & 255]; }
function hex(r,g,bl){ return '#' + [r,g,bl].map(v => Math.max(0, Math.min(255, Math.round(v))).toString(16).padStart(2,'0')).join(''); }
function mix(a, c, t){ const A = rgb(a), C = rgb(c); return hex(A[0] + (C[0]-A[0])*t, A[1] + (C[1]-A[1])*t, A[2] + (C[2]-A[2])*t); }

}

function bitmap(g, rows, ox, oy, pal){

    const ch = rows[y][x]; if (ch !== '.' && pal[ch]) px(g, ox + x, oy + y, 1, 1, pal[ch]);

}
function rot90(rows){ const h = rows.length, w = rows[0].length, out = []; for (let x = 0; x < w; x++) { let s = ''; for (let y = h - 1; y >= 0; y--) s += rows[y][x]; out.push(s); } return out; }
function rotN(rows, n){ let r = rows; for (let k = 0; k < n; k++) r = rot90(r); return r; }
function pdisc(g, cx, cy, r, c){ for (let y = -r; y <= r; y++) for (let x = -r; x <= r; x++) if (x*x + y*y <= r*r + r*0.6) px(g, cx + x, cy + y, 1, 1, c); }

function bevel(g, base, v){
  const Lc = lighten(base, .4), L2 = lighten(base, .18), D = darken(base, .3), D2 = darken(base, .1);
  px(g,0,0,P,P,base);
  px(g,0,0,P,1,Lc); px(g,0,1,1,P-1,Lc); px(g,1,1,P-2,1,L2); px(g,1,2,1,P-3,L2);
  px(g,P-1,1,1,P-1,D); px(g,1,P-1,P-2,1,D); px(g,P-2,2,1,P-3,D2); px(g,2,P-2,P-4,1,D2);
  const r = rng(v*977 + 13);
  for (let k = 0; k < 6; k++) { const x = 3 + Math.floor(r()*10), y = 3 + Math.floor(r()*10); px(g, x, y, 1, 1, r() < .5 ? D2 : L2); }

  px(g,0,0,P,P,base);

  for (let k = 0; k < 3; k++) {
    const bx = 2 + Math.floor(r()*11), by = 2 + Math.floor(r()*11);
    const ph = (k + f) % 4;
    if (ph === 0) px(g, bx, by, 1, 1, bub);
    if (ph === 1) { px(g, bx, by, 2, 2, bub); px(g, bx + 1, by + 1, 1, 1, hi); }
    if (ph === 2) { px(g, bx - 1, by, 1, 1, bub); px(g, bx + 2, by, 1, 1, bub); px(g, bx, by - 1, 2, 1, bub); }

function win(){

    L.parts.push({ x, y, h, vx:Math.cos(a)*s, vy:Math.sin(a)*s, vh:0.8 + Math.random()*1.8, life:0.45 + Math.random()*0.5, color, big:Math.random() < .35 });

function update(dt){

function mood(){

  if (p.inv > 0.85) return 'hurt';
  if (p.flyT > 0) return p.flyT < 1.6 ? 'worried' : 'normal';
  const cur = tileAt(Math.floor(p.x), Math.floor(p.y)).type;
  if (cur === 'acid' || cur === 'lava' || cur === 'crumble') return 'worried';
  const ahead = tileAt(Math.floor(p.x + p.eye.x*0.6), Math.floor(p.y + p.eye.y*0.6)).type;

/* ================= Kingdom map: compass view =================
   The marble sits in the middle with an isle in each direction. Rolling toward a new isle plays it;
   rolling toward a cleared isle moves you onto it, so its neighbors become the next choices. */
const HOME = -1;
const MAP = { at:HOME, anim:null, msg:'', msgT:0, bump:0, face:{ x:1, y:0 } };
const DIRS4 = { up:[0,-1], right:[1,0], down:[0,1], left:[-1,0] };

function neighbor(i, dir){

    if (dir === 'right') return 0;
    if (dir === 'left') return (NODE_COLS - 1)*NODE_ROWS;
    if (dir === 'up') return NODE_ROWS - 1;

  }

const sealedMsg = 'Only open sky that way. Pick another direction.';
function mapGo(dir){

  const n = neighbor(MAP.at, dir);
  if (n === null) { MAP.bump = 0.25; MAP.msg = sealedMsg; MAP.msgT = 2.5; sfx('bump'); updateMapDash(); return; }
  MAP.anim = { dir, to:n, t:0, play:n !== HOME && !isCleared(n) && !dev };

}
function updateMap(dt){
  if (MAP.anim) {
    MAP.anim.t += dt / 0.45;

      const a = MAP.anim; MAP.anim = null;
      if (a.play) { startRun(a.to); return; }
      MAP.at = a.to; save.at = a.to; persist(); MAP.msg = ''; updateMapDash();
    }
  }
  if (MAP.msgT > 0) { MAP.msgT -= dt; if (MAP.msgT <= 0) { MAP.msg = ''; updateMapDash(); } }
  if (MAP.bump > 0) MAP.bump = Math.max(0, MAP.bump - dt);
}
function drawIsland(i, x, y, n){
  const c = i === HOME ? -1 : Math.floor(i / NODE_ROWS), tm = THEMES[Math.max(0, c)];
  const special = c < 0 ? null : [null, 'ice', 'acid', 'lava', 'arrow', 'crumble'][c];
  const X0 = x - n*P/2, Y0 = y - P;
  for (let yy = 0; yy < 2; yy++) for (let xx = 0; xx < n; xx++) {
    const isSp = special && xx === n - 1 && yy === 0;
    const t = isSp ? (special === 'arrow' ? { type:'arrow', d:[1,0], ch:'6' } : { type:special }) : { type:'ground' };
    b.drawImage(tileSprite(t, tm, (i + 3)*7 + xx, yy), X0 + xx*P, Y0 + yy*P);
  }
  for (let xx = 0; xx < n; xx++) b.drawImage(cliffSprite('ground', tm), X0 + xx*P, Y0 + 2*P);
}
const labels = [];
function renderMap(dt){
  const here = MAP.anim && !MAP.anim.play && MAP.anim.t > 0.5 ? MAP.anim.to : MAP.at;
  drawSky(dt, THEMES[Math.max(0, nodeCR(here)[0])], 0, 0);

    for (let k = 3; k < steps - 2; k++) {

  mx = Math.round(mx); my = Math.round(my);
  b.drawImage(shadowSprite(5), mx - 5, my + 2);
  const by = my - 2 - Math.round(hop);
  b.drawImage(ballSprite(5), mx - 5, by - 5);
  drawFacePx(b, mx, by, 5, MAP.face, MAP.bump > 0 ? 'worried' : 'normal');

  { const [x, y] = at(-1, 0); px(b, x, y, s, s, MAP.at === HOME && blink ? '#ffffff' : '#b2a6e0'); }
  for (let i = 0; i < NODE_COLS*NODE_ROWS; i++) {

}

    ctx.font = `700 ${fs}px 'Pixelify Sans', monospace`; const w1 = ctx.measureText(l.text).width;
    const w = Math.max(w1, w2) + 14, h = l.sub ? fs*2.35 : fs*1.45;

const ease = k => k < .5 ? 2*k*k : 1 - Math.pow(-2*k + 2, 2)/2;

let AC = null;
function audio(){
  if (!AC) { try { AC = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { AC = null; } }
  if (AC && AC.state === 'suspended') AC.resume().catch(() => {});
}
function tone(f,d,type,v,slide,delay){
  if (!AC || G.muted) return;
  const t0 = AC.currentTime + (delay || 0);
  const o = AC.createOscillator(), gn = AC.createGain();
  o.type = type || 'square';
  o.frequency.setValueAtTime(f, t0);
  if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(30, f + slide), t0 + d);
  gn.gain.setValueAtTime(0.0001, t0);
  gn.gain.exponentialRampToValueAtTime(v || 0.05, t0 + 0.01);
  gn.gain.exponentialRampToValueAtTime(0.0001, t0 + d);
  o.connect(gn).connect(AC.destination);
  o.start(t0); o.stop(t0 + d + 0.03);
}
const lastSfx = {};
function sfx(n){
  const now = performance.now();
  if (lastSfx[n] && now - lastSfx[n] < 60) return;
  lastSfx[n] = now;
  switch (n) {
    case 'step': tone(330, .07, 'square', .02, 90); break;
    case 'land': tone(160, .06, 'square', .02, -40); break;
    case 'jump': tone(260, .16, 'square', .035, 380); break;
    case 'bump': tone(110, .08, 'square', .025); break;
    case 'gem': tone(988, .08, 'square', .04); tone(1480, .14, 'square', .035, 0, .06); break;
    case 'key': tone(660, .08, 'square', .03); tone(990, .12, 'square', .025, 0, .06); break;
    case 'unlock': tone(440, .1, 'triangle', .06); tone(660, .18, 'triangle', .05, 0, .08); break;
    case 'potion': [523,659,784].forEach((f,k) => tone(f, .12, 'triangle', .05, 0, k*.05)); break;
    case 'clock': tone(1200, .04, 'square', .03); tone(900, .04, 'square', .03, 0, .1); break;
    case 'fly': tone(400, .45, 'triangle', .05, 800); break;
    case 'paint': tone(700, .06, 'triangle', .025, -200); break;
    case 'powerdown': tone(600, .4, 'triangle', .04, -350); break;
    case 'crumble': tone(200, .22, 'sawtooth', .025, -120); break;
    case 'spring': tone(260, .3, 'square', .04, 700); break;
    case 'sizzle': tone(2200, .07, 'sawtooth', .012, -1100); break;
    case 'hurt': tone(900, .28, 'sawtooth', .045, -750); break;
    case 'fall': tone(520, .85, 'square', .04, -440); break;
    case 'win': [523,659,784,1047,1319].forEach((f,k) => tone(f, .22, 'square', .045, 0, k*.08)); break;
    case 'over': [392,330,262].forEach((f,k) => tone(f, .32, 'triangle', .05, 0, k*.15)); break;
  }
}

let jumpTouch = null;
function endJoy(){ joy.active = false; joy.id = null; joyEl.hidden = true; knob.style.transform = ''; }
function jumpDown(){
  audio(); jumpBtn.classList.add('on');
  const wasPlay = G.mode === 'play';
  jumpOrGo();
  if (wasPlay && L) L.jumpHeld = true;
}
function jumpUp(){ jumpTouch = null; jumpBtn.classList.remove('on'); if (L) L.jumpHeld = false; }
function stagePt(t){ const r = stage.getBoundingClientRect(); return { x:t.clientX - r.left, y:t.clientY - r.top, w:r.width }; }
function placeJoy(){
  joyEl.style.left = joy.sx + 'px'; joyEl.style.top = joy.sy + 'px';
  const dx = joy.x - joy.sx, dy = joy.y - joy.sy, m = Math.hypot(dx, dy), k = m > 40 ? 40/m : 1;
  knob.style.transform = `translate(${dx*k}px, ${dy*k}px)`;
}
// Left side of the playfield: a joystick appears centered under the thumb. Right side: hold to keep jumping.
stage.addEventListener('touchstart', e => {
  if (e.target.closest('#overlay') || e.target.closest('button')) return;
  e.preventDefault(); audio();
  if (G.mode !== 'play' && G.mode !== 'map') return;
  for (const t of e.changedTouches) {
    const q = stagePt(t);
    if (G.mode === 'play' && q.x > q.w*0.6) { if (jumpTouch === null) { jumpTouch = t.identifier; jumpDown(); } continue; }
    // A new thumb always takes over, so a lost touch can never leave the joystick stuck.
    joy.active = true; joy.id = t.identifier;
    joy.sx = joy.x = q.x; joy.sy = joy.y = q.y; joy.t0 = performance.now(); joy.moved = false; joy.flick = false;
    joyEl.hidden = G.mode !== 'play';
    placeJoy();
  }
}, { passive:false });
window.addEventListener('touchmove', e => {
  if (e.target && e.target.closest && !e.target.closest('#overlay')) e.preventDefault();
  if (!joy.active) return;
  let found = false;
  for (const t of e.touches) {
    if (t.identifier !== joy.id) continue;
    found = true;
    const q = stagePt(t); joy.x = q.x; joy.y = q.y;
    let dx = joy.x - joy.sx, dy = joy.y - joy.sy, m = Math.hypot(dx, dy);
    if (m > 10) joy.moved = true;
    if (G.mode === 'play' && m > JOY_R) { joy.sx = joy.x - dx/m*JOY_R; joy.sy = joy.y - dy/m*JOY_R; dx = joy.x - joy.sx; dy = joy.y - joy.sy; m = JOY_R; }
    placeJoy();
    if (G.mode === 'map') {
      if (!joy.flick && m > 28) { joy.flick = true; mapGo(Math.abs(dx) > Math.abs(dy) ? (dx > 0 ? 'right' : 'left') : (dy > 0 ? 'down' : 'up')); }
      if (joy.flick && m < 12) joy.flick = false;
    }
  }
  if (!found) endJoy();
}, { passive:false });
function touchEnd(e){
  for (const t of e.changedTouches) {
    if (joy.active && t.identifier === joy.id) {
      const tap = !joy.moved && performance.now() - joy.t0 < 350, x = joy.sx, y = joy.sy;
      endJoy();
      if (tap && G.mode === 'map' && e.type === 'touchend') mapTap(x, y);
    }
    if (t.identifier === jumpTouch) jumpUp();
  }
  // Safety net: drop anything whose finger is no longer on the glass.
  const live = new Set(Array.from(e.touches, t => t.identifier));
  if (joy.active && !live.has(joy.id)) endJoy();
  if (jumpTouch !== null && !live.has(jumpTouch)) jumpUp();
}
window.addEventListener('touchend', touchEnd);
window.addEventListener('touchcancel', touchEnd);
jumpBtn.addEventListener('touchstart', e => { e.preventDefault(); e.stopPropagation(); jumpTouch = e.changedTouches[0].identifier; jumpDown(); }, { passive:false });
jumpBtn.addEventListener('mousedown', e => { e.preventDefault(); jumpDown(); });
jumpBtn.addEventListener('mouseup', jumpUp);
jumpBtn.addEventListener('mouseleave', jumpUp);
pauseBtn.addEventListener('touchstart', e => { e.preventDefault(); e.stopPropagation(); audio(); pause(); }, { passive:false });
pauseBtn.addEventListener('click', () => pause());
const mapSettingsBtn = $('mapSettingsBtn');
mapSettingsBtn.addEventListener('touchstart', e => { e.preventDefault(); e.stopPropagation(); audio(); act('settings', 'map'); }, { passive:false });
mapSettingsBtn.addEventListener('click', () => act('settings', 'map'));
document.addEventListener('gesturestart', e => e.preventDefault());
// Stop iOS from showing the text loupe, callout menu or double-tap zoom during play.
for (const el of [stage, dash]) {
  el.addEventListener('touchstart', e => { if (!e.target.closest('#overlay')) e.preventDefault(); }, { passive:false });
}
document.addEventListener('contextmenu', e => e.preventDefault());
document.addEventListener('selectstart', e => e.preventDefault());
document.getElementById('devBadge').hidden = !dev;

/* ================= Loop ================= */
let last = performance.now();
function frame(now){
  const dt = Math.min(0.05, (now - last) / 1000); last = now; T += dt;
  b.setTransform(1,0,0,1,0,0); b.imageSmoothingEnabled = false; b.globalAlpha = 1;
  const playing = L && (G.mode === 'play' || G.mode === 'result' || G.mode === 'paused');
  if (playing) {
    if (G.mode !== 'paused') update(dt);
    renderPlay(G.mode === 'paused' ? 0 : dt);
    updateDash();
  } else {
    updateMap(dt);
    renderMap(dt);
  }
  ctx.setTransform(1,0,0,1,0,0);
  ctx.imageSmoothingEnabled = false;
  ctx.drawImage(buf, 0, 0, bw, bh, 0, 0, Math.round(bw*SC*DPR), Math.round(bh*SC*DPR));
  if (!playing) drawLabels();
  requestAnimationFrame(frame);
}
resize();
MAP.at = save.at !== undefined && (save.at === HOME || isCleared(save.at)) ? save.at : HOME;
showTitle();
requestAnimationFrame(frame);
})();
</script>
